<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weakest First</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <h1>Weakest first</h1>
      <p>List the topics on your exam, rate how confident you feel in each, and see what to study next.</p>
    </header>

    <form id="exam-form" class="row">
      <label>Exam name
        <input id="exam-name" required maxlength="60" placeholder="Calculus midterm">
      </label>
      <label>Exam date
        <input id="exam-date" type="date" required>
      </label>
      <button type="submit">Add exam</button>
    </form>

    <p id="empty">No exams yet. Add one above, then list its topics.</p>
    <div id="exams"></div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
